<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="AIW" />
<meta name="theme-color" content="#0a0a0a" />
<script>(function(){var m=localStorage.getItem("aiw_theme")||"system";var t=m==="system"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):m;document.documentElement.dataset.theme=t;})();</script>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<title>Aiw</title>
<link rel="icon" type="image/svg+xml" href="logo.svg" />
<link rel="stylesheet" href="app.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="mate.css" />
<link rel="stylesheet" href="mdview.css" />
<link rel="stylesheet" href="approval.css" />
<link rel="stylesheet" href="home.css" />
</head>
<body>
<div id="app">
  <!-- sidebar (desktop) -->
  <nav id="side">
    <div class="brand">
      <img class="logo" src="logo.svg" alt="Aiw" />
      <div class="grow"><div class="heading">Aiw</div><div class="small"><span class="sdot" id="agentDot"></span><span id="agentName">小秘</span> · <span id="agentStatus">空闲</span></div></div>
      <span id="sideAvatar" hidden></span>
    </div>
    <button class="btn primary wide" onclick="newTaskMode()"><i data-i="plus"></i>新建任务</button>
    <div class="navs">
      <button data-view="home" onclick="go('home')"><i data-i="chat"></i>聊天<span class="badge" id="chatBadge"></span></button>
      <button data-view="tasks" onclick="go('tasks')"><i data-i="bolt"></i>任务</button>
      <button data-view="activity" onclick="go('activity')"><i data-i="activity"></i>活动<span class="badge" id="needBadge"></span></button>
      <button data-view="tracking" onclick="go('tracking')"><i data-i="target"></i>追踪</button>
      <button data-view="routines" onclick="go('routines')"><i data-i="clock"></i>例程</button>
      <button data-view="computer" onclick="go('computer')"><i data-i="monitor"></i>电脑</button>
      <button data-view="settings" onclick="go('settings')"><i data-i="settings"></i>设置</button>
    </div>
    <!-- the old conversation list now lives on the 任务 page; kept hidden so app.js/ui.js can still fill it -->
    <div id="threadList" class="threads" hidden></div>
    <button id="archToggle" hidden></button>
  </nav>

  <!-- main column -->
  <section id="main">
    <header id="top">
      <button class="icon" id="backBtn" onclick="backToChat()" aria-label="返回聊天" title="返回聊天" hidden><i data-i="back"></i></button>
      <button class="icon only-mobile" id="menuBtn" onclick="openDrawer()" aria-label="菜单"><i data-i="menu"></i></button>
      <img class="logo sm only-mobile" src="logo.svg" alt="Aiw" />
      <div class="ttl"><div class="heading" id="viewTitle">对话</div><div class="small" id="viewSub"></div></div>
      <span class="chip" id="pillAgent">Agent …</span>
      <button class="btn sm primary" id="newTaskBtn" onclick="newTaskMode()" title="新建任务"><i data-i="plus"></i><span>新建任务</span></button>
      <button class="icon" id="bell" onclick="toggleNotes()" aria-label="通知"><i data-i="bell"></i><span class="dot" id="bellDot"></span></button>
      <button class="icon only-wide" id="deskToggle" onclick="toggleDeskPane()" aria-label="桌面" title="显示/隐藏桌面"><i data-i="monitor"></i></button>
    </header>
    <div id="notes" class="pop"></div>

    <!-- HOME: the persistent chat (main screen; home.js). With nothing new, 球球 sits in the middle and its briefing
         (/api/greeting) pops up around it as speech bubbles (#hstage); "/" opens the skill picker, "+" the attachment sheet. -->
    <div class="view" id="v-home">
      <div id="hstage" class="hstage" aria-live="polite">
        <button class="hhist" id="hHistBtn" onclick="hShowChat()" hidden>↑ 聊天记录</button>
        <div class="hst-core"><span class="mate hst-orb" id="hstOrb" role="img" aria-label="球球"></span></div>
        <div id="hbbs"></div>
      </div>
      <div id="hmsgs" class="scroll"></div>
      <button id="hToLatest" class="fab" onclick="hScrollLatest(true)">↓ 最新消息</button>
      <div class="composer-wrap hcw">
        <div id="hskills" class="hskills" role="listbox" aria-label="技能" hidden></div>
        <div id="hmode" class="hmode" hidden></div>
        <div id="hattach" class="attachments"></div>
        <form class="composer hcomposer" onsubmit="hSend(event)">
          <button type="button" class="icon soft hplus" id="hPlusBtn" onclick="hSheet()" aria-label="添加：拍照、视频、文件、技能" title="添加">＋</button>
          <input type="file" id="hfile" hidden multiple onchange="hUpload(this.files, this)" />
          <input type="file" id="hcam" hidden accept="image/*" capture="environment" onchange="hUpload(this.files, this)" />
          <input type="file" id="hvid" hidden accept="video/*" capture="environment" onchange="hUpload(this.files, this)" />
          <input type="file" id="hlib" hidden multiple accept="image/*,video/*" onchange="hUpload(this.files, this)" />
          <div class="hinput"><span id="htokens" class="htokens"></span>
            <textarea id="hprompt" rows="1" placeholder="和我聊聊，或输入 / 选技能…" oninput="hInput(this)" onkeydown="hKey(event)" onblur="hBlur()" aria-autocomplete="list" aria-controls="hskills"></textarea></div>
          <button class="send" id="hSendBtn" aria-label="发送"><i data-i="up"></i></button>
        </form>
      </div>
      <div id="hsheetDim" class="hsheet-dim" onclick="hSheet(false)"></div>
      <div id="hsheet" class="hsheet" role="dialog" aria-label="添加" aria-hidden="true">
        <div class="hs-grab"></div>
        <div class="hs-grid">
          <button class="hs-it" onclick="hPick('hcam')"><span class="hs-ic" data-hi="camera"></span>拍照</button>
          <button class="hs-it" onclick="hPick('hvid')"><span class="hs-ic" data-hi="video"></span>录视频</button>
          <button class="hs-it" onclick="hPick('hlib')"><span class="hs-ic" data-hi="image"></span>照片/视频</button>
          <button class="hs-it" onclick="hPick('hfile')"><span class="hs-ic" data-hi="folder"></span>文件</button>
          <button class="hs-it" onclick="hSheet(false);newTaskMode()"><span class="hs-ic" data-hi="monitor"></span>新建任务</button>
          <button class="hs-it" id="hVoiceIt" onclick="hSheet(false);hVoice()"><span class="hs-ic" data-hi="mic"></span>语音</button>
          <button class="hs-it" onclick="hSheet(false);hLink()"><span class="hs-ic" data-hi="link"></span>链接</button>
          <button class="hs-it" onclick="hSheet(false);hSlash()"><span class="hs-ic" data-hi="sparkle"></span>技能 /</button>
        </div>
        <div class="hs-dots" id="hsDots" hidden></div>
      </div>
    </div>

    <!-- TASKS: every task (was the sidebar conversation list) -->
    <div class="view scroll" id="v-tasks">
      <div class="page">
        <div class="row gap wrap tk-bar">
          <div class="seg" id="tkFilter">
            <button data-f="all" class="on">全部</button><button data-f="live">进行中</button><button data-f="need">需要你</button>
            <button data-f="failed">没完成</button><button data-f="done">已完成</button><button data-f="arch">已归档</button>
          </div>
          <input id="tkSearch" class="grow" placeholder="搜索任务…" oninput="renderTasksPage()" />
        </div>
        <div id="tkList" class="list"></div>
      </div>
    </div>

    <!-- TASK VIEW (a task's steps; opened from a task card or the 任务 page) -->
    <div class="view" id="v-chat">
      <div id="msgs" class="scroll"></div>
      <button id="toLatest" class="fab" onclick="scrollLatest(true)">↓ 最新</button>
      <div id="queueBar"></div>
      <div class="composer-wrap">
        <div id="attach" class="attachments"></div>
        <form class="composer" onsubmit="submitPrompt(event)">
          <button type="button" class="icon soft" onclick="$('file').click()" aria-label="附件"><i data-i="clip"></i></button>
          <input type="file" id="file" hidden multiple onchange="uploadFiles(this.files)" />
          <textarea id="prompt" rows="1" placeholder="让 Agent 去做点什么…" oninput="autoGrow(this); saveDraft()" onkeydown="promptKey(event)"></textarea>
          <button type="button" class="icon soft" id="micBtn" onclick="toggleMic()" aria-label="语音输入"><i data-i="mic"></i></button>
          <button class="send" id="sendBtn" aria-label="发送"><i data-i="up"></i></button>
        </form>
        <div class="small center hint" id="composerHint"></div>
      </div>
    </div>

    <!-- ACTIVITY -->
    <div class="view scroll" id="v-activity">
      <div class="page">
        <div class="seg" id="actFilter">
          <button data-f="all" class="on">全部</button><button data-f="live">进行中</button>
          <button data-f="need">需要你</button><button data-f="failed">失败</button><button data-f="queued">排队</button>
        </div>
        <div id="actList" class="list"></div>
      </div>
    </div>

    <!-- TRACKING -->
    <div class="view scroll" id="v-tracking">
      <div class="page">
        <div class="card sky">
          <div class="heading">追踪网页</div>
          <div class="muted">定时检查页面：内容变化、出现某段文字、价格低于阈值时提醒你，同一变化只提醒一次。</div>
          <form class="grid2" onsubmit="addWatch(event)">
            <input name="name" placeholder="名称，例如 耳机降价" required />
            <input name="url" placeholder="https://…" required />
            <select name="mode" onchange="this.form.value.placeholder={change:'（可空）',contains:'要出现的文字，例如 有货',price_below:'价格阈值，例如 149'}[this.value]">
              <option value="change">页面有变化</option><option value="contains">出现文字</option><option value="price_below">价格低于</option>
            </select>
            <input name="value" placeholder="（可空）" />
            <select name="interval_min"><option value="15">每 15 分钟</option><option value="60" selected>每小时</option><option value="360">每 6 小时</option><option value="1440">每天</option></select>
            <button class="btn primary"><i data-i="plus"></i>添加追踪</button>
          </form>
        </div>
        <div id="watchList" class="list"></div>
      </div>
    </div>

    <!-- ROUTINES -->
    <div class="view scroll" id="v-routines">
      <div class="page">
        <div class="card lavender">
          <div class="heading">例程</div>
          <div class="muted">按时间自动交给 Agent 的任务，结果会出现在对话里并推送通知。</div>
          <form class="grid2" onsubmit="addRoutine(event)">
            <input name="name" placeholder="名称，例如 每日巡检" required />
            <select name="preset" onchange="if(this.value) this.form.schedule.value=this.value">
              <option value="">常用时间…</option><option value="daily 09:00">每天 09:00</option><option value="0 9 * * 1-5">工作日 09:00</option>
              <option value="every 2h">每 2 小时</option><option value="0 18 * * 5">每周五 18:00</option>
            </select>
            <textarea name="prompt" rows="2" class="span2" placeholder="要做什么，例如：打开 Hacker News，挑 5 条有意思的新闻写成 news.docx 发给我" required></textarea>
            <input name="schedule" placeholder="daily 09:00 / every 30m / cron: 0 9 * * 1-5" required />
            <button class="btn primary"><i data-i="plus"></i>添加例程</button>
          </form>
        </div>
        <div id="routineList" class="list"></div>
      </div>
    </div>

    <!-- COMPUTER -->
    <div class="view scroll" id="v-computer">
      <div class="page">
        <div class="card sky row gap">
          <div class="iconbox"><i data-i="monitor"></i></div>
          <div class="grow"><div class="heading" id="pcTitle">电脑</div><div class="muted" id="pcSub">…</div></div>
        </div>
        <div class="row gap wrap">
          <button class="btn primary" id="takeBtn" onclick="toggleTakeover()"><i data-i="hand"></i>接管桌面</button>
          <button class="btn" onclick="vmOp('start')">开机</button>
          <button class="btn" onclick="vmOp('restart')">重启</button>
          <button class="btn" onclick="vmOp('stop')">关机</button>
          <button class="btn" onclick="snapshot()">快照</button>
          <label class="toggle"><input type="checkbox" id="isoToggle" onchange="localStorage.setItem('aiw_iso', this.checked?'1':'')" /> 下个任务用一次性隔离电脑</label>
        </div>
        <div class="deskframe big"><iframe id="deskBig" title="desktop"></iframe></div>
      </div>
    </div>

    <!-- MEMORY (设置 › 记忆; memory.js) -->
    <div class="view scroll" id="v-memory">
      <div class="page" id="memPage"></div>
    </div>

    <!-- SETTINGS -->
    <div class="view scroll" id="v-settings">
      <div class="page" id="settingsPage"></div>
    </div>
  </section>

  <!-- desktop pane (wide screens, chat view) -->
  <aside id="deskPane">
    <div class="card flat deskhead">
      <div class="iconbox sm"><i data-i="monitor"></i></div>
      <div class="grow"><div class="heading" id="deskTitle">Agent 电脑</div><div class="small" id="deskMode">观看模式</div></div>
      <button class="btn sm" onclick="toggleTakeover()" id="takeBtn2">接管</button>
    </div>
    <div class="deskframe"><iframe id="desk" title="desktop"></iframe></div>
  </aside>

  <!-- mobile tab bar -->
  <nav id="tabs">
    <button data-view="home" onclick="go('home')"><i data-i="chat"></i><span>聊天</span></button>
    <button data-view="tasks" onclick="go('tasks')"><i data-i="bolt"></i><span>任务</span></button>
    <button data-view="activity" onclick="go('activity')"><i data-i="activity"></i><span>活动</span></button>
    <button data-view="computer" onclick="go('computer')"><i data-i="monitor"></i><span>电脑</span></button>
    <button data-view="settings" onclick="go('settings')"><i data-i="settings"></i><span>更多</span></button>
  </nav>
</div>
<div id="shade" onclick="closeOverlays()"></div>
<div id="modal" class="sheet"></div>
<div id="toast"></div>
<script src="takeover.js"></script>
<script src="app.js"></script>
<script src="ui.js"></script>
<script src="approval.js"></script>
<script src="shop.js"></script>
<script src="xhs.js"></script>
<script src="vendor/markdown/markdown-it.min.js"></script>
<script src="vendor/markdown/purify.min.js"></script>
<script src="mdview.js"></script>
<script src="mdpreview.js"></script>

<script src="vendor/emotionball/rings.js"></script>
<script src="vendor/emotionball/emotions.js"></script>
<script src="vendor/emotionball/ball.js"></script>
<script src="vendor/emotionball/engine.js"></script>
<script src="mate-map.js"></script>
<script src="mate.js"></script>
<script src="home.js"></script>
<script src="memory.js"></script>
<script src="deeplink.js"></script>
</body>
</html>
