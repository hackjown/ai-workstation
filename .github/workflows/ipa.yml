name: ipa
on:
  push:
    branches: [main]
    paths: ["apps/ios/**", "apps/web/icon-512.png", ".github/workflows/ipa.yml"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (clang + lld + ldid + iPhoneOS SDK)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld libplist-dev libssl-dev python3-pil zip
          git clone -q --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          make -C /tmp/ldid -j"$(nproc)"
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS16.5.sdk
      - name: Build (fakesigned, for TrollStore)
        run: SDK=/tmp/sdks/iPhoneOS16.5.sdk LDID=/tmp/ldid/ldid ./apps/ios/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AIWorkstation-ipa
          path: apps/ios/AIWorkstation.ipa
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-latest
          name: AIWorkstation IPA (latest)
          prerelease: true
          files: apps/ios/AIWorkstation.ipa
