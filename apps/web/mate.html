<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>球球</title>
<!-- 球球 (Emotion Ball, github.com/sam70361/aora-bot emotion-ball/; visuals for personal learning/research only,
     no commercial use: vendor/emotionball/LICENSE + NOTICE.md).
     Embedded by the iOS app (WKWebView, bundled copy) in the chat header. The app drives it with evaluateJavaScript:
       aiwMate.event({type, data})  a task/session event (mapped by mate-map.js)
       aiwMate.status("running")    a task's stored status
       aiwMate.set("33", true)      an emotion id directly (+ burst)
       aiwMate.active(false)        stop the animation loop (app in background)
     ?static=1 renders single frames only (Reduce Motion). 3.8: amber ring + white face + black eyes everywhere. -->
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; }
  /* 3.8 look (user's request, replaces the "keep the orb unchanged" rule): an amber ring, a white face, black eyes. The
     ring is a radial gradient in % of the radius, so it keeps its proportion at every size (112 pt home orb, 30 pt head).
     The engine's body is white (AiwMood.LOOK), so the red / pink emotion bodies are gone; expressions are unchanged.
     Dark mode: the same white face (a touch warmer) and a brighter amber ring, so it stays legible on a dark page.
     ?ring=amber is kept for old callers (same look); ?bg=0: no ring or fill. */
  #m { --mate-fill: #FFFFFF; --mate-ring: #C87618; --sketch-ink: rgba(26,26,26,.85);
       position: absolute; inset: 0; box-sizing: border-box; border-radius: 50%; padding: 10%; color-scheme: light;
       background: radial-gradient(circle closest-side, var(--mate-fill) 0, var(--mate-fill) 90.5%, var(--mate-ring) 92%, var(--mate-ring) 100%, transparent 100.5%); }
  @media (prefers-color-scheme: dark) { #m { --mate-fill: #F7F4EE; --mate-ring: #E8A050; } }
  #m.nobg { background: transparent; padding: 0; }
  #m > svg { filter: drop-shadow(0 1.5px 2px rgba(120,70,10,.22)); }
</style>
</head>
<body>
<div id="m" role="img" aria-label="球球"></div>
<script src="vendor/emotionball/rings.js"></script>
<script src="vendor/emotionball/emotions.js"></script>
<script src="vendor/emotionball/ball.js"></script>
<script src="vendor/emotionball/engine.js"></script>
<script src="mate-map.js"></script>
<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search);
  var still = q.get("static") === "1" || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  var M = AiwMood, ID = M.ID, cur = q.get("e") || ID.IDLE, settleT = 0, live = !still;
  var host = document.getElementById("m");
  if (q.get("bg") === "0") host.className = "nobg";
  else if (q.get("ring") === "amber") host.className = "amber";
  var eng = EmotionBall.create(host, { emotion: cur, idle: false, shape: "blob", eyeScale: +(q.get("eye") || 1.6), lite: q.get("lite") === "1", autostart: live, label: "球球",
                                       color: M.LOOK.color, eyeColor: M.LOOK.eyeColor });
  if (!live) eng.renderStatic();
  function post(o) { try { window.webkit.messageHandlers.mate.postMessage(o); } catch (e) { /* not in the app */ } }
  var HOLD = { "31": 1400, "39": 1400, "36": 700, "40": 700, "38": 900 }, holdUntil = 0, holdT = 0, queuedSettle = false;
  function set(id, burst, settle) {
    var now = Date.now();
    if (holdUntil > now && id !== cur) {
      if (queuedSettle && !settle) return;   // a queued 完成/出错 wins over a later status refresh
      queuedSettle = !!settle; clearTimeout(holdT);
      holdT = setTimeout(function () { queuedSettle = false; set(id, burst, settle); }, holdUntil - now); return;
    }
    queuedSettle = false; clearTimeout(holdT);
    if (id !== cur) holdUntil = now + (HOLD[id] || 0);
    clearTimeout(settleT); settleT = 0;
    if (settle) settleT = setTimeout(function () { settleT = 0; set(ID.IDLE); }, settle);
    if (id !== cur) { cur = id; eng.handleAIMessage({ emotionId: id }); }
    if (!live) eng.renderStatic(); else if (burst) eng.burst(24);
    document.getElementById("m").setAttribute("aria-label", "球球 · " + (M.NAMES[id] || id));
    post({ mood: id });
  }
  window.aiwMate = {
    set: function (id, burst) { set(String(id), !!burst); },
    event: function (e) { if (typeof e === "string") e = JSON.parse(e); var r = M.fromEvent(e); if (r) set(r.id, r.burst, r.settle); },
    // a finished task's stored status must not cut the 完成/出错 moment short: it settles to idle by itself
    status: function (s) { if (!M.isLive(s) && settleT) return; set(M.fromStatus(s)); },
    active: function (a) { live = !!a && !still; eng.setActive(live); if (!live) eng.renderStatic(); },
    still: function (s) { still = !!s; this.active(!still); },
    get: function () { return cur; }
  };
  document.addEventListener("visibilitychange", function () { window.aiwMate.active(!document.hidden); });
  post({ ready: true, mood: cur });
})();
</script>
</body>
</html>
