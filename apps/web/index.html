<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="AIW" />
<meta name="theme-color" content="#FCFCFC" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<title>AI Workstation</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div id="app">
  <!-- sidebar (desktop) -->
  <nav id="side">
    <div class="brand">
      <button class="avatar" id="sideAvatar" onclick="go('settings')" title="设置"></button>
      <div><div class="heading" id="agentName">AI Workstation</div><div class="small" id="agentStatus">空闲</div></div>
    </div>
    <button class="btn primary wide" onclick="newThread()"><i data-i="plus"></i>新对话</button>
    <div class="navs">
      <button data-view="chat" onclick="go('chat')"><i data-i="chat"></i>对话</button>
      <button data-view="activity" onclick="go('activity')"><i data-i="activity"></i>活动<span class="badge" id="needBadge"></span></button>
      <button data-view="tracking" onclick="go('tracking')"><i data-i="target"></i>追踪</button>
      <button data-view="routines" onclick="go('routines')"><i data-i="clock"></i>例程</button>
      <button data-view="computer" onclick="go('computer')"><i data-i="monitor"></i>电脑</button>
      <button data-view="settings" onclick="go('settings')"><i data-i="settings"></i>设置</button>
    </div>
    <div class="label pad">对话</div>
    <div id="threadList" class="threads"></div>
    <button class="link small pad" onclick="toggleArchived()" id="archToggle">查看已归档</button>
  </nav>

  <!-- main column -->
  <section id="main">
    <header id="top">
      <button class="icon only-mobile" onclick="openDrawer()" aria-label="对话列表"><i data-i="menu"></i></button>
      <div class="ttl"><div class="heading" id="viewTitle">对话</div><div class="small" id="viewSub"></div></div>
      <span class="chip" id="pillAgent">Agent …</span>
      <button class="icon" id="bell" onclick="toggleNotes()" aria-label="通知"><i data-i="bell"></i><span class="dot" id="bellDot"></span></button>
      <button class="icon only-wide" id="deskToggle" onclick="toggleDeskPane()" aria-label="桌面" title="显示/隐藏桌面"><i data-i="monitor"></i></button>
    </header>
    <div id="notes" class="pop"></div>

    <!-- CHAT -->
    <div class="view" id="v-chat">
      <div id="msgs" class="scroll"></div>
      <button id="toLatest" class="fab" onclick="scrollLatest(true)">↓ 最新</button>
      <div id="queueBar"></div>
      <div class="composer-wrap">
        <div id="attach" class="attachments"></div>
        <form class="composer" onsubmit="submitPrompt(event)">
          <button type="button" class="icon soft" onclick="$('file').click()" aria-label="附件"><i data-i="clip"></i></button>
          <input type="file" id="file" hidden multiple onchange="uploadFiles(this.files)" />
          <textarea id="prompt" rows="1" placeholder="让 Agent 去做点什么…" oninput="autoGrow(this); saveDraft()" onkeydown="promptKey(event)"></textarea>
          <button type="button" class="icon soft" id="micBtn" onclick="toggleMic()" aria-label="语音输入"><i data-i="mic"></i></button>
          <button class="send" id="sendBtn" aria-label="发送"><i data-i="up"></i></button>
        </form>
        <div class="small center hint" id="composerHint"></div>
      </div>
    </div>

    <!-- ACTIVITY -->
    <div class="view scroll" id="v-activity">
      <div class="page">
        <div class="seg" id="actFilter">
          <button data-f="all" class="on">全部</button><button data-f="live">进行中</button>
          <button data-f="need">需要你</button><button data-f="failed">失败</button><button data-f="queued">排队</button>
        </div>
        <div id="actList" class="list"></div>
      </div>
    </div>

    <!-- TRACKING -->
    <div class="view scroll" id="v-tracking">
      <div class="page">
        <div class="card sky">
          <div class="heading">追踪网页</div>
          <div class="muted">定时检查页面：内容变化、出现某段文字、价格低于阈值时提醒你，同一变化只提醒一次。</div>
          <form class="grid2" onsubmit="addWatch(event)">
            <input name="name" placeholder="名称，例如 耳机降价" required />
            <input name="url" placeholder="https://…" required />
            <select name="mode" onchange="this.form.value.placeholder={change:'（可空）',contains:'要出现的文字，例如 有货',price_below:'价格阈值，例如 149'}[this.value]">
              <option value="change">页面有变化</option><option value="contains">出现文字</option><option value="price_below">价格低于</option>
            </select>
            <input name="value" placeholder="（可空）" />
            <select name="interval_min"><option value="15">每 15 分钟</option><option value="60" selected>每小时</option><option value="360">每 6 小时</option><option value="1440">每天</option></select>
            <button class="btn primary"><i data-i="plus"></i>添加追踪</button>
          </form>
        </div>
        <div id="watchList" class="list"></div>
      </div>
    </div>

    <!-- ROUTINES -->
    <div class="view scroll" id="v-routines">
      <div class="page">
        <div class="card lavender">
          <div class="heading">例程</div>
          <div class="muted">按时间自动交给 Agent 的任务，结果会出现在对话里并推送通知。</div>
          <form class="grid2" onsubmit="addRoutine(event)">
            <input name="name" placeholder="名称，例如 每日巡检" required />
            <select name="preset" onchange="if(this.value) this.form.schedule.value=this.value">
              <option value="">常用时间…</option><option value="daily 09:00">每天 09:00</option><option value="0 9 * * 1-5">工作日 09:00</option>
              <option value="every 2h">每 2 小时</option><option value="0 18 * * 5">每周五 18:00</option>
            </select>
            <textarea name="prompt" rows="2" class="span2" placeholder="要做什么，例如：打开 Hacker News，挑 5 条有意思的新闻写成 news.docx 发给我" required></textarea>
            <input name="schedule" placeholder="daily 09:00 / every 30m / cron: 0 9 * * 1-5" required />
            <button class="btn primary"><i data-i="plus"></i>添加例程</button>
          </form>
        </div>
        <div id="routineList" class="list"></div>
      </div>
    </div>

    <!-- COMPUTER -->
    <div class="view scroll" id="v-computer">
      <div class="page">
        <div class="card sky row gap">
          <div class="iconbox"><i data-i="monitor"></i></div>
          <div class="grow"><div class="heading" id="pcTitle">电脑</div><div class="muted" id="pcSub">…</div></div>
        </div>
        <div class="row gap wrap">
          <button class="btn primary" id="takeBtn" onclick="toggleTakeover()"><i data-i="hand"></i>接管桌面</button>
          <button class="btn" onclick="vmOp('start')">开机</button>
          <button class="btn" onclick="vmOp('restart')">重启</button>
          <button class="btn" onclick="vmOp('stop')">关机</button>
          <button class="btn" onclick="snapshot()">快照</button>
          <label class="toggle"><input type="checkbox" id="isoToggle" onchange="localStorage.setItem('aiw_iso', this.checked?'1':'')" /> 下个任务用一次性隔离电脑</label>
        </div>
        <div class="deskframe big"><iframe id="deskBig" title="desktop"></iframe></div>
      </div>
    </div>

    <!-- SETTINGS -->
    <div class="view scroll" id="v-settings">
      <div class="page" id="settingsPage"></div>
    </div>
  </section>

  <!-- desktop pane (wide screens, chat view) -->
  <aside id="deskPane">
    <div class="card flat deskhead">
      <div class="iconbox sm"><i data-i="monitor"></i></div>
      <div class="grow"><div class="heading">Agent 电脑</div><div class="small" id="deskMode">观看模式</div></div>
      <button class="btn sm" onclick="toggleTakeover()" id="takeBtn2">接管</button>
    </div>
    <div class="deskframe"><iframe id="desk" title="desktop"></iframe></div>
  </aside>

  <!-- mobile tab bar -->
  <nav id="tabs">
    <button data-view="chat" onclick="go('chat')"><i data-i="chat"></i><span>对话</span></button>
    <button data-view="activity" onclick="go('activity')"><i data-i="activity"></i><span>活动</span></button>
    <button data-view="tracking" onclick="go('tracking')"><i data-i="target"></i><span>追踪</span></button>
    <button data-view="computer" onclick="go('computer')"><i data-i="monitor"></i><span>电脑</span></button>
    <button data-view="settings" onclick="go('settings')"><i data-i="settings"></i><span>更多</span></button>
  </nav>
</div>
<div id="shade" onclick="closeOverlays()"></div>
<div id="modal" class="sheet"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
