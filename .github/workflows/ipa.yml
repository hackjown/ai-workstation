name: ipa
on:
  push:
    branches: [main]
    paths: ["apps/ios/**", "apps/web/mate.html", "apps/web/mate-map.js", "apps/web/vendor/emotionball/**", "apps/web/mdview.*", "apps/web/takeover.*", "apps/web/vendor/markdown/**", ".github/workflows/ipa.yml"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tools (ldid + Pillow)
        run: |
          brew install ldid >/dev/null
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          xcrun --sdk iphoneos --show-sdk-version; swift --version
      - name: Build native SwiftUI app (fakesigned, for TrollStore)
        run: |
          set -o pipefail
          bash apps/ios/build-ipa.sh 2>&1 | tee /tmp/build.log
      - name: Report build error
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Build failed at ${GITHUB_SHA::7}"; echo '```'; grep -E "error:|warning: .*(deprecated|unused)" -A3 /tmp/build.log | head -150; echo '---'; tail -n 40 /tmp/build.log; echo '```'; } > /tmp/body.md
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
      - name: Report success
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "AiwShare.appex embedded" /tmp/build.log; then ext="with AiwShare.appex"
          else ext=$'WITHOUT AiwShare.appex (extension build failed)\n```\n'"$(grep -E "Share/.*error:" -A3 /tmp/build.log | head -60)"$'\n```'; fi
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "Build OK at ${GITHUB_SHA::7} ($(du -h apps/ios/AIWorkstation.ipa | cut -f1)) $ext"
      - uses: actions/upload-artifact@v4
        with:
          name: AIWorkstation-ipa
          path: apps/ios/AIWorkstation.ipa
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            if gh release view ipa-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload ipa-latest apps/ios/AIWorkstation.ipa --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            else
              gh release create ipa-latest apps/ios/AIWorkstation.ipa --title "Aiw iOS (native, latest)" --prerelease --repo "$GITHUB_REPOSITORY" && exit 0
            fi
            echo "Release publish attempt $i failed, retrying in 10s..."
            sleep 10
          done
          exit 1
